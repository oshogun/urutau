# Runs the released Urutau image with a SQLite database in a named volume.
#   docker compose pull && docker compose up -d
# Set URUTAU_VERSION=X.Y.Z to pin a release; the default is latest.
# Open http://localhost:8787 (URUTAU_HOST_PORT changes the host port). A DNS name needs
# PUBLIC_URL (see README.md).
# Only the variables listed under environment: reach the container; the shell or a .env file
# fills in their values.
# To build the checkout instead:
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
services:
  urutau:
    image: ghcr.io/oshogun/urutau:${URUTAU_VERSION:-latest}
    ports:
      - '127.0.0.1:${URUTAU_HOST_PORT:-8787}:8080'
    volumes:
      - urutau-data:/data
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:/data/urutau.db}
      PUBLIC_URL: ${PUBLIC_URL:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      KEYCLOAK_GITHUB_IDP: ${KEYCLOAK_GITHUB_IDP:-}
      KEYCLOAK_BROKER_API: ${KEYCLOAK_BROKER_API:-v1}
      KEYCLOAK_ALLOW_HTTP: ${KEYCLOAK_ALLOW_HTTP:-false}
      # Optional. 32 bytes as base64 (openssl rand -base64 32). Without it, agent integrations
      # cannot store a GitHub token.
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
    restart: unless-stopped
volumes:
  urutau-data:
