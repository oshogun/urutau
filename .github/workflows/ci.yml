name: CI

on:
  push:
    branches: [main]
    # A `vX.Y.Z` tag starts a run whose release and publish-image jobs run after
    # the checks (docs/release.md).
    tags: ['v*']
  pull_request:

# Read-only by default; only the release job widens this to contents: write, and
# only publish-image gets packages: write.
permissions:
  contents: read

# A newer push cancels the older run of the same branch or pull request. A tag
# run is never cancelled: stopping a release run part-way can leave a Release
# without its image.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Runs the database suites of server/db against real PostgreSQL and MariaDB.
  # The Keycloak suite stays opt-in (npm run test:keycloak): its image is large and slow to start.
  databases:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: urutau
          POSTGRES_PASSWORD: urutau-dev
          POSTGRES_DB: urutau
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U urutau"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_USER: urutau
          MARIADB_PASSWORD: urutau-dev
          MARIADB_DATABASE: urutau
          MARIADB_ROOT_PASSWORD: urutau-root-dev
        ports:
          - 53306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:db:postgres
      - run: npm run test:db:mariadb

  # Publishes a GitHub Release from an annotated `vX.Y.Z` tag, once the checks
  # pass on that commit. A tag whose checks fail never gets a Release or an image.
  release:
    runs-on: ubuntu-latest
    needs: [check, databases]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # The tag, package.json and both version fields of package-lock.json must
      # agree, so a checkout of the tag, and the image built from it, carry the
      # version of the release they belong to.
      - name: Verify the tag matches the package versions
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${TAG#v}"
          PKG_VERSION="$(jq -r .version package.json)"
          LOCK_VERSION="$(jq -r .version package-lock.json)"
          LOCK_ROOT_VERSION="$(jq -r '.packages[""].version' package-lock.json)"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ] || [ "$TAG_VERSION" != "$LOCK_VERSION" ] || [ "$TAG_VERSION" != "$LOCK_ROOT_VERSION" ]; then
            echo "::error::Tag $TAG (version $TAG_VERSION) does not match package.json ($PKG_VERSION), package-lock.json version ($LOCK_VERSION) or package-lock.json packages[\"\"].version ($LOCK_ROOT_VERSION). Delete the tag (git push origin :refs/tags/$TAG && git tag -d $TAG), bump all three to $TAG_VERSION, commit on main, and tag again."
            exit 1
          fi

      - name: Skip if the Release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the Release from the annotated tag
        if: steps.existing.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # actions/checkout may leave an annotated tag as a plain reference to
          # its commit, which drops the message. Fetch the tag object itself.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          # A lightweight tag has no message. `git tag -l --format` then returns
          # the tagged commit's subject and body instead, and the Release would be
          # titled after whatever the commit said. Test the object type: an empty
          # subject cannot detect this case.
          TAG_TYPE="$(git cat-file -t "refs/tags/$TAG")"
          if [ "$TAG_TYPE" != "tag" ]; then
            echo "::error::$TAG is a lightweight tag ($TAG_TYPE), not an annotated one. Delete it (git push origin :refs/tags/$TAG && git tag -d $TAG), tag again with git tag -a $TAG, and push the tag."
            exit 1
          fi
          SUBJECT="$(git tag -l "$TAG" --format='%(contents:subject)')"
          if [ -z "$SUBJECT" ]; then
            echo "::error::$TAG has an empty message. Delete it (git push origin :refs/tags/$TAG && git tag -d $TAG) and tag again with git tag -a $TAG and a message whose first line is the Release title."
            exit 1
          fi
          # %(contents:subject) is the first paragraph folded into one line, and
          # the folded lines are missing from %(contents:body). A title that wraps
          # onto a second line therefore gives a wrong title and incomplete notes.
          # Comparing the subject with the first line of the message detects it.
          CONTENTS="$(git tag -l "$TAG" --format='%(contents)')"
          FIRST_LINE="${CONTENTS%%$'\n'*}"
          if [ "$SUBJECT" != "$FIRST_LINE" ]; then
            echo "::error::$TAG has a title that wraps onto more than one line. Delete it (git push origin :refs/tags/$TAG && git tag -d $TAG) and tag again with the title on a single line, followed by a blank line."
            exit 1
          fi
          BODY="$(git tag -l "$TAG" --format='%(contents:body)')"
          # A version with a `-` (1.2.0-beta.1) is a prerelease: mark it as one,
          # so it never becomes the repository's Latest release.
          PRERELEASE_FLAGS=()
          case "${TAG#v}" in
            *-*) PRERELEASE_FLAGS+=(--prerelease) ;;
          esac
          echo "Title: $SUBJECT"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$SUBJECT" --notes "$BODY" \
            "${PRERELEASE_FLAGS[@]}"

  # Pushes the multi-architecture image to GHCR once the Release exists, so a tag
  # that fails the release job's checks never publishes an image. It logs in with
  # the workflow's own GITHUB_TOKEN; no repository secret is needed.
  publish-image:
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest=auto: a prerelease tag gets only its exact version tag. The {{major}}
      # tag is skipped for 0.x, where a minor version can break compatibility, so
      # no floating `0` tag points across breaking releases.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/oshogun/urutau
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=publish
          cache-to: type=gha,scope=publish,mode=max
