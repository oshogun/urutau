<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple kanban-style issue tracker for GitHub repositories." />
    <title>Urutau</title>
    <script>
      // Apply the saved Carbon theme before first paint so dark mode doesn't flash white.
      // Mirrors useCarbonTheme(); the React app takes over once it mounts.
      try {
        var saved = JSON.parse(localStorage.getItem('urutau:settings') || '{}')
        var pref = (saved.state && saved.state.theme) || 'system'
        var dark =
          pref === 'dark' ||
          (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.add(dark ? 'cds--g100' : 'cds--white')
      } catch (error) {
        document.documentElement.classList.add('cds--white')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
